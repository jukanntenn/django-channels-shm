name: CI

# Reusable: release.yml calls this workflow as its test gate, so the test
# matrix exists in exactly one place.
permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter needs this for PR file lists

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: change detection. Every other job reads its outputs.
  # When called from release.yml (tag push) there is no base to diff
  # against, so every filter resolves to true — full CI as release gate.
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      python: ${{ github.event_name == 'workflow_call' && 'true' || steps.f.outputs.python }}
      rust: ${{ github.event_name == 'workflow_call' && 'true' || steps.f.outputs.rust }}
      precommit: ${{ github.event_name == 'workflow_call' && 'true' || steps.f.outputs.precommit }}
      ci: ${{ github.event_name == 'workflow_call' && 'true' || steps.f.outputs.ci }}
      docs_only: ${{ github.event_name == 'workflow_call' && 'false' || steps.docscheck.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        if: github.event_name != 'workflow_call'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'stubs/**'
              - 'bench/**/*.py'
              - 'scripts/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
            rust:
              - 'crates/**'
              - 'build.rs'
            precommit:
              - 'prek.toml'
              - 'crates/_channels_shm_native/prek.toml'
              - 'examples/chat/prek.toml'
              - '.typos.toml'
            ci:
              - '.github/workflows/**'
            docs:
              - '*.md'
              - 'LICENSE'
              - '.gitignore'
      - id: docscheck
        # docs_only = docs changed AND nothing else changed
        if: github.event_name != 'workflow_call' && steps.f.outputs.python == 'false' && steps.f.outputs.rust == 'false' && steps.f.outputs.precommit == 'false' && steps.f.outputs.ci == 'false'
        run: echo "docs_only=true" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: prek — the single format/lint/check gate (same one that runs
  # locally on commit). CI installs the toolchains prek's hooks call and
  # runs prek itself; no ruff/cargo-fmt/clippy invocation is duplicated in
  # this file. Covers the workspace root + crates + examples/chat configs.
  # ─────────────────────────────────────────────────────────────────────
  prek:
    name: "prek run --all-files"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.precommit == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable   # cargo fmt + clippy + cargo metadata --locked
      - run: uv sync --group linting          # ruff for the root project's hooks
      # examples/chat is an orphan prek project with its own env: its ruff
      # and uv-lock hooks run there. uv sync builds channels-shm from the
      # path source through maturin (release build; uv cache holds the wheel).
      - run: uv sync --group linting
        working-directory: examples/chat
      - run: uv tool install prek
      - run: prek validate-config prek.toml crates/_channels_shm_native/prek.toml examples/chat/prek.toml
      # Runs every hook in every project (format + lint + check groups) on
      # all files. Fails if anything needed fixing, any lint fired, or any
      # lock file is stale.
      - run: prek run --all-files

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: type check (basedpyright, committed progressive baseline)
  # The committed .basedpyright-baseline.json absorbs the known errors. The
  # first step refreshes it (--writebaseline exits 0 when the file already
  # exists); the second step fails only on NEW errors vs the baseline.
  # Refresh the committed baseline locally after intentional error changes:
  #   uv run basedpyright --writebaseline --baselinefile .basedpyright-baseline.json
  # ─────────────────────────────────────────────────────────────────────
  typecheck:
    name: "basedpyright (matrix)"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --group type-checking
      - run: uvx maturin develop --skip-install
      - name: "Refresh baseline (absorbs current errors)"
        run: uv run basedpyright --writebaseline --baselinefile .basedpyright-baseline.json
      - name: "Check against baseline (fails only on NEW errors)"
        run: uv run basedpyright --baselinefile .basedpyright-baseline.json

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: tests (fast, no slow/e2e)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: "pytest (matrix)"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # abi3-py311 build (dropped 3.10 to unlock pyo3 PyBuffer zero-copy, H-01).
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --group dev
      - run: uvx maturin develop --skip-install
      - run: uv run pytest -m "not slow and not e2e" --cov -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 4b: release-mode smoke (python -O) — verifies the if __debug__:
  # blocks (O3 observability gating) don't break under -O, where those code
  # paths are eliminated. Runs only the fast core subset (F-07 / X-04).
  # ─────────────────────────────────────────────────────────────────────
  test-release-smoke:
    name: "pytest -O smoke"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --group dev
      - run: uvx maturin develop --skip-install
      # -O strips assert + eliminates if __debug__: blocks; the core send/
      # receive/group/flush paths must still work without the observability
      # hooks. Property/concurrency tests are enough to surface latent bugs.
      # -W ignores the pytest "assertions not executed" config warning that -O
      # itself triggers (pyproject's filterwarnings=error would otherwise fail
      # the run before any test executes).
      - run: uv run python -O -m pytest tests/layer/ tests/test_serializer.py tests/native/ -q -W "ignore::pytest.PytestConfigWarning"

  # ─────────────────────────────────────────────────────────────────────
  # Job 5: cross-process integration (slow, linux only, single version)
  # ─────────────────────────────────────────────────────────────────────
  test-cross-process:
    name: "pytest slow (cross-process)"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --group dev
      - run: uvx maturin develop --skip-install
      - run: uv run pytest -m slow -v

  # ─────────────────────────────────────────────────────────────────────
  # Job 6: e2e Django/channels stack (docker compose)
  # ─────────────────────────────────────────────────────────────────────
  e2e:
    name: "e2e (docker compose)"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker --version
      - run: docker compose --version
      - name: "Build e2e image"
        working-directory: tests/e2e
        run: docker compose build
      - name: "Start worker replicas"
        working-directory: tests/e2e
        run: docker compose up -d worker1 worker2 worker3
      - name: "Wait for workers"
        working-directory: tests/e2e
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000 >/dev/null 2>&1 || docker compose ps | grep -q "Up"; then break; fi
            sleep 2
          done
          # workers don't serve HTTP root; just sleep to let daphne bind
          sleep 8
      - name: "Run e2e tests"
        working-directory: tests/e2e
        run: docker compose run --rm runner pytest tests/e2e/ -v
      - name: "Tear down"
        if: always()
        working-directory: tests/e2e
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────
  # Job 7: Rust tests (fmt + clippy live in prek, job 2)
  # ─────────────────────────────────────────────────────────────────────
  rust:
    name: "cargo test"
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/_channels_shm_native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  # ─────────────────────────────────────────────────────────────────────
  # Job 8: native build verification (maturin)
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: "maturin build"
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release
